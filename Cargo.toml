[package]
name = "biliget"
version = "0.6.10"
edition = "2024"
readme = "README.md"
description = "简单的B站视频下载工具 支持免登录下载B站高清视频"

authors = ["lfcypo <lfcypo@gmail.com>"]
license = "MIT"
repository = "https://github.com/lfcypo/biliget"

homepage = "https://github.com/lfcypo/biliget"
keywords = ["bilibili", "download", "cli", "video"]
categories = ["command-line-utilities"]

[dependencies]
http = "1.5.0"
serde_json = "1.0.154"
regex = "1.13.1"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
sanitize-filename = "0.6.0"
fast-down-ffi = { version = "0.4.2", features = ["file", "mem"] }
tokio = { version = "1.54.1", default-features = false, features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "signal",
    "process"
] }
fs4 = "1.1.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
url = "2.5.8"
tokio-util = "0.7.20"
indicatif = { version = "0.18.6", features = ["tokio"] }

[[bin]]
name = "biliget"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
incremental = false
